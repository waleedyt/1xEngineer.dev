<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 640" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="seq-arrow-req" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
    <marker id="seq-arrow-res" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="575" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">RadSec Multi-Tenant Request-Response Lifecycle</text>

  <!-- Zone 1: Tenant Premises Background -->
  <rect x="50" y="55" width="370" height="560" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="65" y="45" width="180" height="22" rx="4" fill="#475569"/>
  <text x="155" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Tenant Premises (On-Site)</text>

  <!-- Zone 2: AWS Infrastructure Background -->
  <rect x="470" y="55" width="630" height="560" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="485" y="45" width="190" height="22" rx="4" fill="#0284c7"/>
  <text x="580" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">AWS Cloud Infrastructure</text>

  <!-- Vertical Lifelines -->
  <line x1="130" y1="130" x2="130" y2="590" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="330" y1="130" x2="330" y2="590" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="560" y1="130" x2="560" y2="590" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="780" y1="130" x2="780" y2="590" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="1000" y1="130" x2="1000" y2="590" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Participant Headers -->
  <g transform="translate(60, 80)" filter="url(#shadow)">
    <rect width="140" height="46" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="70" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Access Point</text>
    <text x="70" y="36" text-anchor="middle" font-size="10" fill="#64748b">NAS Client</text>
  </g>

  <g transform="translate(260, 80)" filter="url(#shadow)">
    <rect width="140" height="46" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="70" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">RadSec Proxy</text>
    <text x="70" y="36" text-anchor="middle" font-size="10" fill="#78350f">On-Prem mTLS Gateway</text>
  </g>

  <g transform="translate(490, 80)" filter="url(#shadow)">
    <rect width="140" height="46" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="70" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">AWS NLB</text>
    <text x="70" y="36" text-anchor="middle" font-size="10" fill="#0284c7">L4 Passthrough</text>
  </g>

  <g transform="translate(710, 80)" filter="url(#shadow)">
    <rect width="140" height="46" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="70" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">FreeRADIUS Fleet</text>
    <text x="70" y="36" text-anchor="middle" font-size="10" fill="#047857">Terminates mTLS</text>
  </g>

  <g transform="translate(930, 80)" filter="url(#shadow)">
    <rect width="140" height="46" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <text x="70" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca">Auth Service</text>
    <text x="70" y="36" text-anchor="middle" font-size="10" fill="#4f46e5">Backend API</text>
  </g>

  <!-- Step 1: AP -> Proxy -->
  <g transform="translate(0, 160)">
    <line x1="130" y1="0" x2="322" y2="0" stroke="#0284c7" stroke-width="2" marker-end="url(#seq-arrow-req)"/>
    <rect x="145" y="-18" width="165" height="18" rx="3" fill="#e0f2fe"/>
    <text x="227" y="-5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0369a1">1. Access-Request (UDP 1812)</text>
  </g>

  <!-- Note over Proxy: mTLS Encapsulation -->
  <g transform="translate(235, 190)" filter="url(#shadow)">
    <rect width="190" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="95" y="16" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Wraps in RadSec TLS (TCP 2083)</text>
    <text x="95" y="32" text-anchor="middle" font-size="9.5" fill="#78350f">Attaches Tenant Client Cert (mTLS)</text>
  </g>

  <!-- Step 2: Proxy -> NLB -->
  <g transform="translate(0, 260)">
    <line x1="330" y1="0" x2="552" y2="0" stroke="#0284c7" stroke-width="2" marker-end="url(#seq-arrow-req)"/>
    <rect x="355" y="-18" width="170" height="18" rx="3" fill="#e0f2fe"/>
    <text x="440" y="-5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0369a1">2. RadSec TLS (TCP 2083 WAN)</text>
  </g>

  <!-- Step 3: NLB -> FreeRADIUS -->
  <g transform="translate(0, 295)">
    <line x1="560" y1="0" x2="772" y2="0" stroke="#0284c7" stroke-width="2" marker-end="url(#seq-arrow-req)"/>
    <rect x="580" y="-18" width="170" height="18" rx="3" fill="#e0f2fe"/>
    <text x="665" y="-5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0369a1">3. Passthrough TCP Stream</text>
  </g>

  <!-- Note over FreeRADIUS: Decrypts and extracts CN -->
  <g transform="translate(685, 325)" filter="url(#shadow)">
    <rect width="190" height="42" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
    <text x="95" y="16" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">Terminates mTLS Handshake</text>
    <text x="95" y="32" text-anchor="middle" font-size="9.5" font-weight="600" fill="#047857">Extracts TLS-Client-Cert-CN</text>
  </g>

  <!-- Step 4: FreeRADIUS -> Auth Service -->
  <g transform="translate(0, 395)">
    <line x1="780" y1="0" x2="992" y2="0" stroke="#0284c7" stroke-width="2" marker-end="url(#seq-arrow-req)"/>
    <rect x="795" y="-18" width="185" height="18" rx="3" fill="#e0f2fe"/>
    <text x="887" y="-5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0369a1">4. rlm_rest POST (Tenant CN + User)</text>
  </g>

  <!-- Note over Auth Service: Resolves Policy -->
  <g transform="translate(905, 425)" filter="url(#shadow)">
    <rect width="190" height="42" rx="6" fill="#ede9fe" stroke="#6366f1" stroke-width="1.2"/>
    <text x="95" y="16" text-anchor="middle" font-size="10" font-weight="600" fill="#4338ca">Validates Tenant &amp; User</text>
    <text x="95" y="32" text-anchor="middle" font-size="9.5" fill="#5b21b6">Resolves Policy &amp; Filter-Id</text>
  </g>

  <!-- Step 5: Auth Service to FreeRADIUS -->
  <g transform="translate(0, 495)">
    <line x1="1000" y1="0" x2="788" y2="0" stroke="#10b981" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#seq-arrow-res)"/>
    <rect x="805" y="-18" width="170" height="18" rx="3" fill="#d1fae5"/>
    <text x="890" y="-5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#065f46">5. HTTP 200 OK (Filter-Id)</text>
  </g>

  <!-- Step 6: FreeRADIUS to Proxy -->
  <g transform="translate(0, 535)">
    <line x1="780" y1="0" x2="338" y2="0" stroke="#10b981" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#seq-arrow-res)"/>
    <rect x="470" y="-18" width="180" height="18" rx="3" fill="#d1fae5"/>
    <text x="560" y="-5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#065f46">6. RadSec Access-Accept (Filter-Id)</text>
  </g>

  <!-- Step 7: Proxy to AP -->
  <g transform="translate(0, 575)">
    <line x1="330" y1="0" x2="138" y2="0" stroke="#10b981" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#seq-arrow-res)"/>
    <rect x="145" y="-18" width="170" height="18" rx="3" fill="#d1fae5"/>
    <text x="230" y="-5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#065f46">7. RADIUS Access-Accept (UDP)</text>
  </g>
</svg>

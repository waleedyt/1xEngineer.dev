<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 640" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="seq-arrow-req" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
    <marker id="seq-arrow-res" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="575" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">Native RadSec (Direct Device) Request-Response Lifecycle</text>

  <!-- Zone 1: Tenant Premises Background -->
  <rect x="50" y="55" width="280" height="560" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="65" y="45" width="180" height="22" rx="4" fill="#475569"/>
  <text x="155" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Tenant Premises (On-Site)</text>

  <!-- Zone 2: AWS Infrastructure Background -->
  <rect x="380" y="55" width="720" height="560" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="395" y="45" width="190" height="22" rx="4" fill="#0284c7"/>
  <text x="490" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">AWS Cloud Infrastructure</text>

  <!-- Vertical Lifelines -->
  <line x1="190" y1="130" x2="190" y2="590" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="490" y1="130" x2="490" y2="590" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="730" y1="130" x2="730" y2="590" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="970" y1="130" x2="970" y2="590" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Participant Headers -->
  <g transform="translate(115, 80)" filter="url(#shadow)">
    <rect width="150" height="46" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="75" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">RadSec AP / Switch</text>
    <text x="75" y="36" text-anchor="middle" font-size="10" fill="#0284c7">Native mTLS Client</text>
  </g>

  <g transform="translate(415, 80)" filter="url(#shadow)">
    <rect width="150" height="46" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="75" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">AWS NLB</text>
    <text x="75" y="36" text-anchor="middle" font-size="10" fill="#0284c7">L4 Passthrough</text>
  </g>

  <g transform="translate(655, 80)" filter="url(#shadow)">
    <rect width="150" height="46" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="75" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">FreeRADIUS Fleet</text>
    <text x="75" y="36" text-anchor="middle" font-size="10" fill="#047857">Terminates mTLS</text>
  </g>

  <g transform="translate(895, 80)" filter="url(#shadow)">
    <rect width="150" height="46" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <text x="75" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca">Auth Service</text>
    <text x="75" y="36" text-anchor="middle" font-size="10" fill="#4f46e5">Backend API</text>
  </g>

  <!-- Note over Native AP: Embedded Cert -->
  <g transform="translate(90, 150)" filter="url(#shadow)">
    <rect width="200" height="42" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
    <text x="100" y="16" text-anchor="middle" font-size="10" font-weight="600" fill="#0369a1">Native RadSec Client</text>
    <text x="100" y="32" text-anchor="middle" font-size="9.5" fill="#0284c7">Embedded Tenant mTLS Cert</text>
  </g>

  <!-- Step 1: AP -> NLB -->
  <g transform="translate(0, 220)">
    <line x1="190" y1="0" x2="482" y2="0" stroke="#0284c7" stroke-width="2" marker-end="url(#seq-arrow-req)"/>
    <rect x="250" y="-18" width="180" height="18" rx="3" fill="#e0f2fe"/>
    <text x="340" y="-5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0369a1">1. RadSec TLS (TCP 2083 WAN)</text>
  </g>

  <!-- Step 2: NLB -> FreeRADIUS -->
  <g transform="translate(0, 260)">
    <line x1="490" y1="0" x2="722" y2="0" stroke="#0284c7" stroke-width="2" marker-end="url(#seq-arrow-req)"/>
    <rect x="525" y="-18" width="170" height="18" rx="3" fill="#e0f2fe"/>
    <text x="610" y="-5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0369a1">2. Passthrough TCP Stream</text>
  </g>

  <!-- Note over FreeRADIUS: Decrypts and extracts CN -->
  <g transform="translate(635, 290)" filter="url(#shadow)">
    <rect width="190" height="42" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
    <text x="95" y="16" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">Terminates mTLS Handshake</text>
    <text x="95" y="32" text-anchor="middle" font-size="9.5" font-weight="600" fill="#047857">Extracts TLS-Client-Cert-CN</text>
  </g>

  <!-- Step 3: FreeRADIUS -> Auth Service -->
  <g transform="translate(0, 360)">
    <line x1="730" y1="0" x2="962" y2="0" stroke="#0284c7" stroke-width="2" marker-end="url(#seq-arrow-req)"/>
    <rect x="755" y="-18" width="185" height="18" rx="3" fill="#e0f2fe"/>
    <text x="847" y="-5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0369a1">3. rlm_rest POST (Tenant CN + User)</text>
  </g>

  <!-- Note over Auth Service: Resolves Policy -->
  <g transform="translate(875, 390)" filter="url(#shadow)">
    <rect width="190" height="42" rx="6" fill="#ede9fe" stroke="#6366f1" stroke-width="1.2"/>
    <text x="95" y="16" text-anchor="middle" font-size="10" font-weight="600" fill="#4338ca">Validates Tenant &amp; User</text>
    <text x="95" y="32" text-anchor="middle" font-size="9.5" fill="#5b21b6">Resolves Policy &amp; Filter-Id</text>
  </g>

  <!-- Step 4: Auth Service to FreeRADIUS -->
  <g transform="translate(0, 460)">
    <line x1="970" y1="0" x2="738" y2="0" stroke="#10b981" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#seq-arrow-res)"/>
    <rect x="770" y="-18" width="165" height="18" rx="3" fill="#d1fae5"/>
    <text x="852" y="-5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#065f46">4. HTTP 200 OK (Filter-Id)</text>
  </g>

  <!-- Step 5: FreeRADIUS to NLB -->
  <g transform="translate(0, 505)">
    <line x1="730" y1="0" x2="498" y2="0" stroke="#10b981" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#seq-arrow-res)"/>
    <rect x="520" y="-18" width="180" height="18" rx="3" fill="#d1fae5"/>
    <text x="610" y="-5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#065f46">5. Passthrough TCP Stream</text>
  </g>

  <!-- Step 6: NLB to Native AP -->
  <g transform="translate(0, 550)">
    <line x1="490" y1="0" x2="198" y2="0" stroke="#10b981" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#seq-arrow-res)"/>
    <rect x="250" y="-18" width="180" height="18" rx="3" fill="#d1fae5"/>
    <text x="340" y="-5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#065f46">6. RadSec Access-Accept (Filter-Id)</text>
  </g>
</svg>
